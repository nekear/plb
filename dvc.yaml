        deps:
            - data/interim/word_instances.jsonl
            - data/interim/lexemes.jsonl
            - data/interim/decks.jsonl
            - data/interim/users.jsonl
            - models/model_a/${model_a.run_name}
            - src/plb/model_a/common/config.py
            - src/plb/model_a/common/inference.py
            - src/plb/model_a/common/modeling.py
            - src/plb/model_a/kvl/data.py
            - src/plb/model_a/precompute/precompute_predictions.py
        params:
            - params.yaml:
                  - model_a.run_name
                  - model_a.precompute
        outs:
            - ${model_a.precompute.output_path}

    augment_model_a_multils:
        cmd: uv run --extra augment -m plb.model_a.multils.augment
        deps:
            - data/raw/multils_japanese
            - src/plb/model_a/multils/augment.py
            - src/plb/model_a/common/config.py
            - src/plb/model_a/multils/augmentation.py
            - src/plb/model_a/multils/cues.py
            - src/plb/model_a/multils/data.py
        params:
            - model_a.multils.augmentation
            - model_a.multils.cues_path
        outs:
            - data/interim/model_a/multils_l1_cues.checkpoint.jsonl:
                  persist: true
            - data/interim/model_a/multils_l1_cues.tsv
            - data/interim/model_a/multils_l1_cues_quarantine.tsv
        frozen: true

    evaluate_model_a_multils_fine_tuned:
        cmd: uv run --extra train -m plb.model_a.multils.evaluate_fine_tuned
        deps:
            - data/raw/multils_japanese
            - data/interim/model_a/multils_l1_cues.tsv
            - models/model_a/${model_a.run_name}
            - src/plb/model_a/common/config.py
            - src/plb/model_a/common/inference.py
            - src/plb/model_a/kvl/data.py
            - src/plb/model_a/common/modeling.py
            - src/plb/model_a/multils/evaluation.py
            - src/plb/model_a/multils/cues.py
            - src/plb/model_a/multils/data.py
            - src/plb/model_a/multils/metrics.py
            - src/plb/model_a/multils/prompts.py
            - src/plb/model_a/multils/evaluate_fine_tuned.py
        params:
            - params.yaml:
                  - model_a.batch_size
                  - model_a.run_name
                  - model_a.multils.condition
                  - model_a.multils.cues_path
                  - model_a.multils.bootstrap_samples
                  - model_a.multils.bootstrap_seed
        metrics:
            - evaluations/model_a/${model_a.run_name}/multils_japanese/fine_tuned/metrics.json:
                  cache: false
        outs:
            - evaluations/model_a/${model_a.run_name}/multils_japanese/fine_tuned/predictions_inference.csv
            - evaluations/model_a/${model_a.run_name}/multils_japanese/fine_tuned/predictions_per_annotator.csv
            - evaluations/model_a/${model_a.run_name}/multils_japanese/fine_tuned/predictions_item_macro.csv
            - evaluations/model_a/${model_a.run_name}/multils_japanese/fine_tuned/predictions_per_l1_item.csv
            - evaluations/model_a/${model_a.run_name}/multils_japanese/fine_tuned/calibration.png

    evaluate_model_a_multils_base:
