stages:
    normalize:
        cmd: uv run -m plb.normalize --release-dir data/release --output-dir data/interim
        deps:
            - data/release
            - src/plb/normalize/__main__.py
            - src/plb/normalize/process.py
            - src/plb/normalize/readings.py
            - src/plb/normalize/extractors.py
            - src/plb/normalize/helpers.py
            - src/plb/normalize/schema.py
        outs:
            - data/interim/users.jsonl
            - data/interim/decks.jsonl
            - data/interim/lexemes.jsonl
            - data/interim/word_instances.jsonl
            - data/interim/reviews.jsonl

    clean_reviews:
        cmd: uv run -m plb.reviews.clean_reviews
        deps:
            - data/interim/reviews.jsonl
            - src/plb/reviews/clean_reviews.py
        outs:
            - data/processed/clean_reviews.jsonl

    replay_reviews_fsrs:
        cmd: uv run -m plb.reviews.replay_fsrs
        deps:
            - data/interim/decks.jsonl
            - data/interim/word_instances.jsonl
            - data/processed/clean_reviews.jsonl
            - src/plb/reviews/replay_fsrs.py
        outs:
            - data/processed/clean_reviews_w_fsrs.jsonl

    calculate_stability_targets:
        cmd: uv run -m plb.reviews.calculate_stability_targets
        deps:
            - data/interim/word_instances.jsonl
            - data/processed/clean_reviews_w_fsrs.jsonl
            - src/plb/reviews/calculate_stability_targets.py
        outs:
            - data/processed/word_instances_w_stability_targets.jsonl

    embed_word_instances_direct:
        cmd: uv run --extra train -m plb.embeddings.direct
        deps:
            - ${embeddings.direct.word_instances_path}
            - src/plb/embeddings/direct/config.py
            - src/plb/embeddings/direct/__main__.py
            - src/plb/utils.py
        params:
            - embeddings.direct
        outs:
            - ${embeddings.direct.output_path}

    # Scoring is the expensive half and depends on no selection setting, so it
    # is deliberately kept free of percentiles/top_k/calibration params: retuning any
    # of those must re-run only select_similarity_neighbors.
    score_similarity_pairs:
        cmd: uv run -m plb.similarities.score_pairs
        deps:
            - data/interim/decks.jsonl
            - data/interim/lexemes.jsonl
            - ${embeddings.direct.output_path}
            - data/processed/word_instances_w_stability_targets.jsonl
            - data/raw/esm/12144_2021_2664_MOESM1_ESM.xlsx
            - data/raw/niteru/stroke_ulrich.txt
            - src/plb/esm/kana_confusability.py
            - src/plb/niteru/niteru.py
            - src/plb/cohort.py
            - src/plb/learners.py
            - src/plb/similarities/cache.py
            - src/plb/similarities/config.py
            - src/plb/similarities/morphological.py
            - src/plb/similarities/orthographic.py
            - src/plb/similarities/phonological.py
            - src/plb/similarities/pipeline.py
            - src/plb/similarities/score_pairs.py
            - src/plb/similarities/semantic.py
            - src/plb/similarities/types.py
        params:
            - cohort
            - similarities.cache
            - similarities.workers
            - similarities.target_chunk_size
        outs:
            - ${similarities.cache.path}:
                  persist: true

    select_similarity_neighbors:
        cmd: uv run -m plb.similarities.select_neighbors
        deps:
            - data/interim/decks.jsonl
            - data/interim/lexemes.jsonl
            - data/processed/clean_reviews_w_fsrs.jsonl
            - data/processed/word_instances_w_stability_targets.jsonl
            - ${similarities.cache.path}
            - src/plb/cohort.py
            - src/plb/learners.py
            - src/plb/similarities/cache.py
            - src/plb/similarities/calibration.py
            - src/plb/similarities/config.py
            - src/plb/similarities/pipeline.py
            - src/plb/similarities/select_neighbors.py
            - src/plb/similarities/types.py
        params:
            - cohort
            - similarities.cache
            - similarities.percentiles
            - similarities.calibration
            - similarities.top_k
        outs:
            - data/processed/similarities.jsonl
            - data/processed/randomities.jsonl
            - ${similarities.calibration.output_path}

    create_model_b_splits:
        cmd: uv run -m plb.model_b.preparation.create_splits
        deps:
            - data/interim/decks.jsonl
            - data/interim/lexemes.jsonl
            - data/processed/word_instances_w_stability_targets.jsonl
            - src/plb/cohort.py
            - src/plb/learners.py
            - src/plb/model_b/config.py
            - src/plb/model_b/preparation/create_splits.py
        params:
            - cohort
            - model_b.splits
        outs:
            - data/processed/model_b/train_word_instances.jsonl
            - data/processed/model_b/eval_word_instances.jsonl
            - data/processed/model_b/test_word_instances.jsonl

    train_model_b_global_median:
        cmd: uv run -m plb.model_b.ablations.train global_median
        deps:
            - data/processed/model_b/eval_word_instances.jsonl
            - data/processed/model_b/train_word_instances.jsonl
