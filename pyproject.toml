[project]
name = "plb"
version = "0.1.0"
description = "Predicting personalized vocabulary learning burden from Anki review logs (NLP4CALL 2026)."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fsrs>=6.3.1",
    "fugashi>=1.5.2",
    "g2p-plus>=0.1.6",
    "matplotlib>=3.11.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pandas-stubs~=3.0.3",
    "panphon>=0.22.2",
    "pyarrow>=24.0.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "pyjson5>=2.0.1",
    "pyyaml>=6.0",
    "rapidfuzz>=3.14.5",
    "scipy>=1.17.1",
    "tqdm>=4.68.3",
    "unidic-lite>=1.0.8",
    "scipy-stubs~=1.17.1",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "lifelines>=0.30.0",
    "marimo[recommended]>=0.23.14",
    "pytest>=8.3",
    "seaborn>=0.13.2",
    "statsmodels~=0.14.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plb"]

[project.optional-dependencies]
augment = [
    "openai>=2.0",
]

train = [
    "torch>=2.4",
    "transformers>=4.57",
    "accelerate>=1.0",
    "scikit-learn>=1.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
